<!doctype html>
<html lang="ko" data-app="admin">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>본선 관리</title>
<link rel="stylesheet" href="common.css">
<style>
  .team .members { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .team .members label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .team .nick { color: var(--text); font-size: 14px; min-height: 21px; }
  .team .nick.bad { color: var(--danger); }
  .picks h3 { font-size: 14px; margin: 12px 0 0; color: var(--muted); }
  @media (max-width: 520px) { .team .members { grid-template-columns: 1fr; } }

  .tabs { display: flex; gap: 6px; margin: 12px 0; align-items: center; }
  button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  .matches { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px; }
  .matches button { text-align: left; line-height: 1.3; }
  .matches small { display: block; font-size: 12px; opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .onair { color: var(--danger); font-weight: 700; font-size: 12px; }
  .on .onair { color: inherit; }
  .r1 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  select { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; min-width: 0; }
  input[type=time], input[type=date] { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .fx { margin-top: 10px; display: grid; gap: 6px; }
  .fx-name { width: 80px; font-weight: 700; }
  .game { border-top: 1px solid var(--line); padding: 12px 0; }
  .game.locked { opacity: .5; }
  .side label select { padding: 5px 4px; font-size: 13px; }
  .game .base { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .side h3 { font-size: 14px; margin: 0 0 4px; }
  .side label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin: 4px 0; }
  .side label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .side input { width: 120px; text-align: right; font-variant-numeric: tabular-nums; }
  .num { font-variant-numeric: tabular-nums; }
  .lead { color: var(--ok); font-weight: 700; }
  @media (max-width: 520px) { .sides { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>본선 관리</h1>
  <div id="app"><p class="hint">불러오는 중…</p></div>
</main>

<script type="module">
  import { auth, ROOM, AUTH_URL, STAGES, MATCHES, SCENES, FX_TYPES, FX_DIRS, FX_COLORS, FX_MS, BUTTONS, PATTERNS, BASE_MIN, BASE_MAX, BASE_STEP, roomRef, esc, jacketUrl, fmtTime, fmtScore, slots, pickSong, normLive, derive, serverNow, matchInfo, gameCount, teamTotal, gameDiff } from './common.js';
  import { signInWithCustomToken, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { onValue, set, remove, update, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

  var KEY_STORE = 'cisne-admin-key';
  var app = document.getElementById('app');
  var state = { config: {}, teams: {}, picks: {}, live: {}, scores: {} };
  var drafts = {};          // 저장 전 입력값 { <팀ID>: { name, ids: [a, b], nicks: { id: 닉네임|null } } }
  var typing = {};          // 저장 전 점수 입력값 { data-k: 글자 }
  var timerDraft = {};      // 저장 전 타이머 입력값 { day, time } (다시 그려도 남도록)
  var notice = '', subs = [];
  var tab = location.hash === '#game' ? 'game' : 'teams';
  var edit = '';            // 경기 진행 탭에서 보고 있는 경기

  function key() { try { return sessionStorage.getItem(KEY_STORE) || ''; } catch (e) { return ''; } }
  // 403이어도 우리 서버가 키를 거부한 것({error:'key'})인지, 프록시가 막은 것인지 구분합니다
  async function keyRejected(r) {
    if (r.status !== 403) return false;
    try { return (await r.clone().json()).error === 'key'; } catch (e) { return false; }
  }
  function setKey(v) { try { v ? sessionStorage.setItem(KEY_STORE, v) : sessionStorage.removeItem(KEY_STORE); } catch (e) { /* 저장 안 됨 */ } }

  // 다시 그려도 입력 중이던 칸의 포커스와 커서를 유지합니다
  function show(html) {
    var a = document.activeElement, k = a && a.dataset && a.dataset.k, pos = k ? a.selectionStart : 0;
    app.innerHTML = (notice ? '<p class="msg ' + notice.cls + '">' + esc(notice.text) + '</p>' : '') + html;
    var e = k && app.querySelector('[data-k="' + k + '"]');
    if (e) { e.focus(); try { e.setSelectionRange(pos, pos); } catch (x) { /* 커서 없는 입력 */ } }
  }
  function say(cls, text) { notice = { cls: cls, text: text }; render(); }

  function loginScreen() {
    show('<div class="card"><h2>관리자 로그인</h2><form class="row" id="login">' +
      '<input type="password" id="key" class="grow" placeholder="관리자 비밀키" autocomplete="current-password">' +
      '<button class="primary">로그인</button></form></div>');
    document.getElementById('login').onsubmit = async function (e) {
      e.preventDefault();
      var k = document.getElementById('key').value.trim();
      try {
        var r = await fetch(AUTH_URL + '/admin/token', { method: 'POST', body: new URLSearchParams({ key: k }) });
        if (await keyRejected(r)) { notice = { cls: 'error', text: '비밀키가 맞지 않습니다.' }; return loginScreen(); }
        if (!r.ok) throw new Error((r.status === 403 ? '프록시에서 차단됨 ' : '서버 오류 ') + r.status);
        setKey(k);
        notice = '';
        // 이미 같은 관리자 계정(uid 'admin')으로 로그인돼 있으면 Firebase가 상태 변경을 알리지 않으므로 직접 시작합니다
        var before = auth.currentUser && auth.currentUser.uid;
        await signInWithCustomToken(auth, (await r.json()).token);
        if (before && before === auth.currentUser.uid) start(auth.currentUser);
      } catch (err) {
        notice = { cls: 'error', text: '로그인에 실패했습니다: ' + err.message };
        loginScreen();
      }
    };
  }

  function teamIds() {
    return Object.keys(state.teams).sort(function (a, b) { return (state.teams[a].n || 0) - (state.teams[b].n || 0); });
  }

  // 저장된 팀은 입력을 시작할 때 드래프트로 복사합니다 (그 전에는 DB 값을 그대로 보여 줍니다)
  function fromState(tid) {
    var t = state.teams[tid] || {}, m = t.members || {}, ids = Object.keys(m);
    if (t.lead in m) ids.sort(function (a, b) { return (b === t.lead) - (a === t.lead); });
    return { name: t.name || '', ids: [ids[0] || '', ids[1] || ''], nicks: Object.assign({}, m) };
  }
  function draftOf(tid) { return drafts[tid] || (drafts[tid] = fromState(tid)); }

  function nickHtml(d, id) {
    if (!id) return '';
    if (!(id in d.nicks)) return '<span class="hint">닉네임 확인 전</span>';
    return d.nicks[id] === null ? '<span class="nick bad">서버에 없는 ID</span>' : esc(d.nicks[id]);
  }

  function teamCard(tid, i) {
    var d = drafts[tid] || fromState(tid), saved = !!state.teams[tid];
    var html = '<div class="card team" data-tid="' + tid + '"><h2>' + (i + 1) + '팀' + (saved ? '' : ' (저장 안 됨)') + '</h2>' +
      '<div class="row"><input type="text" class="grow" data-f="name" maxlength="20" placeholder="팀명 (선수가 정함, 관리자 수정 가능)" value="' + esc(d.name) + '"></div>' +
      '<div class="members">';
    [0, 1].forEach(function (k) {
      html += '<label>선수 ' + (k + 1) + (k ? ' (팀원)' : ' (팀장)') + ' 디스코드 ID<input type="text" inputmode="numeric" data-f="id' + k + '" placeholder="예: 832653005580926986" value="' + esc(d.ids[k]) + '">' +
        '<span class="nick">' + nickHtml(d, d.ids[k]) + '</span></label>';
    });
    html += '</div><div class="row"><button type="button" data-act="nicks">닉네임 불러오기</button>' +
      '<button type="button" class="primary" data-act="save">저장</button>' +
      '<button type="button" class="danger" data-act="delete">삭제</button></div>';
    if (saved && !(state.teams[tid].lead in (state.teams[tid].members || {}))) html += '<p class="hint">팀장이 지정되지 않았습니다. 선수 1을 팀장으로 하려면 저장을 다시 누르세요.</p>';
    if (saved) {
      var p = state.picks[tid];
      html += '<div class="picks">';
      STAGES.forEach(function (stage) {
        html += '<h3>' + stage.name + '</h3>';
        slots(p, stage).forEach(function (c, j) {
          var pk = tid + '/' + stage.key + (stage.count > 1 ? '/' + j : '') + '/';
          var sel = function (r, label) {
            var v = (c && c[r]) || {};
            return '<div class="row"><small>' + label + '</small><select data-pdiff="' + pk + r + '/btn">' + diffOptions(BUTTONS, v.btn, '버튼') + '</select>' +
              '<select data-pdiff="' + pk + r + '/pat">' + diffOptions(PATTERNS, v.pat, '패턴') + '</select></div>';
          };
          html += '<div class="slot">' + (c ? '<img class="jacket" alt="" src="' + jacketUrl(c) + '">' : '<div class="jacket"></div>') +
            '<div class="name">' + (c ? esc(c.n) + sel('lead', '팀장') + sel('mate', '팀원') : '<small>미정</small>') + '</div>' +
            '<button type="button" data-act="pick" data-stage="' + stage.key + '" data-i="' + j + '">' + (c ? '변경' : '곡 선택') + '</button>' +
            (c ? '<button type="button" class="danger" data-act="clear" data-stage="' + stage.key + '" data-i="' + j + '">비우기</button>' : '') + '</div>';
        });
      });
      html += '</div>';
    }
    return html + '</div>';
  }

  function render() {
    if (!key()) return;
    var html = '<nav class="tabs"><button type="button" data-act="tab" data-tab="teams"' + (tab === 'teams' ? ' class="on"' : '') + '>팀·자선곡</button>' +
      '<button type="button" data-act="tab" data-tab="game"' + (tab === 'game' ? ' class="on"' : '') + '>경기 진행</button>' +
      '<span class="grow"></span><a href="view.html" target="_blank">진행자 화면</a><button type="button" data-act="logout">로그아웃</button></nav>';
    show(html + (tab === 'game' ? gameHtml() : teamsHtml()));
  }

  function teamsHtml() {
    var dl = state.config.deadline || 0;
    var local = dl ? new Date(dl + 9 * 3600000).toISOString().slice(0, 16) : '';
    var html = '<div class="card"><h2>자선곡 마감</h2><div class="row">' +
      '<input type="datetime-local" id="deadline" value="' + local + '"><button type="button" data-act="deadline">저장</button>' +
      '<span class="hint">현재: ' + fmtTime(dl) + ' (한국 시간)</span></div>' +
      '<p class="hint">선수 입력 주소: <a href="pick.html">pick.html</a> · 마감 전에는 선수가, 마감 후에는 관리자만 바꿀 수 있습니다.</p></div>';
    var ids = teamIds().concat(Object.keys(drafts).filter(function (t) { return !state.teams[t]; }));
    ids.forEach(function (tid, i) { html += teamCard(tid, i); });
    return html + '<div class="row"><button type="button" data-act="add">팀 추가</button></div>';
  }

  // ── 경기 진행 탭

  function teamName(tid) {
    var t = tid && state.teams[tid];
    if (!t) return '';
    return t.name || Object.keys(t.members || {}).map(function (k) { return t.members[k]; }).join(' · ');
  }
  // 대진표 점수: 6강·4강은 획득 점수 합(작을수록 유리), 결승은 판마다 차이가 작은 팀의 승수
  function matchSum(live, scores, mid) {
    var ids = derive(live).teams[mid], out = {};
    if (!ids[0] || !ids[1]) return out;
    for (var i = 0; i < gameCount(mid); i++) {
      var d = ids.map(function (tid) { return gameDiff(live, state.teams, scores, mid, i, tid); });
      if (matchInfo(mid).stage === 'f') {
        if (d[0] == null || d[1] == null) continue;
        ids.forEach(function (tid) { out[tid] = out[tid] || 0; });
        if (d[0] !== d[1]) out[ids[d[0] < d[1] ? 0 : 1]]++;
      } else {
        ids.forEach(function (tid, k) { if (d[k] != null) out[tid] = (out[tid] || 0) + d[k]; });
      }
    }
    return out;
  }
  // 결승에서 한 팀이 2승하면 남은 판은 하지 않습니다
  function finalDone(live, mid) {
    var s = live.matches[mid].sum;
    return matchInfo(mid).stage === 'f' && Object.keys(s).some(function (t) { return s[t] >= 2; });
  }

  function setPath(obj, path, val) {
    var ks = path.split('/'), o = obj;
    for (var i = 0; i < ks.length - 1; i++) {
      if (o[ks[i]] == null || typeof o[ks[i]] !== 'object') o[ks[i]] = {};
      o = o[ks[i]];
    }
    if (val === null) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = val;
  }
  // 경기 데이터를 바꾸면서 대진표 점수(sum)도 같이 다시 계산해 저장합니다
  function saveMatch(mid, patch) {
    var copy = JSON.parse(JSON.stringify({ live: state.live, scores: state.scores }));
    Object.keys(patch).forEach(function (p) { setPath(copy, p, patch[p]); });
    var live = normLive(copy.live);
    live.matches[mid].sum = matchSum(live, copy.scores, mid);
    patch['live/matches/' + mid + '/sum'] = live.matches[mid].sum;
    return update(roomRef(), patch);
  }

  function randInt(n) { var a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }
  function randomBase() { return BASE_MIN + randInt((BASE_MAX - BASE_MIN) / BASE_STEP + 1) * BASE_STEP; }

  // 자선곡에 정해 둔 난이도는 곡을 넣을 때 두 팀 선수 모두에게 똑같이 적용합니다
  // (팀장은 팀장 난이도, 팀원은 팀원 난이도를 따릅니다)
  function songOf(c) { return c ? { s: c.s, n: c.n } : null; }
  function presetDiff(c, ids) {
    if (!c || !(c.lead || c.mate)) return null;
    var d = {};
    ids.forEach(function (tid) {
      var t = state.teams[tid] || {};
      Object.keys(t.members || {}).forEach(function (uid) {
        var v = c[uid === t.lead ? 'lead' : 'mate'];
        if (!v || !(v.btn || v.pat)) return;
        d[uid] = {};
        if (v.btn) d[uid].btn = v.btn;
        if (v.pat) d[uid].pat = v.pat;
      });
    });
    return d;
  }

  // 6강·4강: 두 팀 자선곡을 판 순서대로 (왼쪽 팀 먼저)
  function loadPicks(mid, ids, patch) {
    var stage = matchInfo(mid).stage, games = normLive(state.live).matches[mid].games;
    ids.forEach(function (tid, i) {
      var c = (state.picks[tid] || {})[stage] || null, song = songOf(c), old = (games[i] || {}).song, p = 'live/matches/' + mid + '/games/' + i + '/';
      var d = presetDiff(c, ids);
      patch[p + 'song'] = song;
      patch[p + 'by'] = tid;
      // 곡이 바뀌면 그 곡에 넣었던 선수별 난이도도 지웁니다
      if (d) patch[p + 'd'] = d;
      else if (!song || !old || song.s !== old.s) patch[p + 'd'] = null;
    });
    return patch;
  }

  function options(list, cur) {
    return list.map(function (o) { return '<option value="' + o.id + '"' + (String(o.id) === String(cur) ? ' selected' : '') + '>' + o.name + '</option>'; }).join('');
  }
  // 화면마다 그 화면으로 바뀔 때의 전환 효과
  function fxHtml(all) {
    var html = '<div class="fx"><div class="hint">전환 효과 (그 화면으로 바뀔 때)</div>';
    SCENES.forEach(function (s) {
      var fx = all[s.id], k = s.id + '/';
      html += '<div class="row"><span class="fx-name">' + s.name + '</span><select data-fx="' + k + 'type">' + options(FX_TYPES, fx.type) + '</select>';
      if (fx.type === 'swipe' || fx.type === 'slide') html += '<select data-fx="' + k + 'dir">' + options(FX_DIRS, fx.dir) + '</select>';
      if (fx.type === 'color') html += '<select data-fx="' + k + 'color">' + options(FX_COLORS, fx.color) + '</select>';
      if (fx.type !== 'cut') html += '<select data-fx="' + k + 'ms">' + options(FX_MS.map(function (ms) { return { id: ms, name: ms / 1000 + '초' }; }), fx.ms) + '</select>';
      html += '<button type="button" data-act="fx-all" data-scene="' + s.id + '">모든 화면에 적용</button></div>';
    });
    return html + '</div>';
  }

  function kstDay(ms) { return new Date(ms + 9 * 3600000).toISOString().slice(0, 10); }

  function sceneHtml(live) {
    var html = '<div class="card"><h2>방송 화면</h2><div class="row">';
    SCENES.forEach(function (s) {
      html += '<button type="button" data-act="scene" data-scene="' + s.id + '"' + (live.scene === s.id ? ' class="on"' : '') + '>' + s.name + '</button>';
    });
    var end = '';
    if (live.timer) {
      var opt = { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit' };
      // 오늘이 아니면 날짜도 함께 보여 줍니다
      if (kstDay(live.timer) !== kstDay(serverNow())) { opt.month = 'long'; opt.day = 'numeric'; }
      end = new Date(live.timer).toLocaleString('ko-KR', opt);
    }
    html += '</div><div class="row" style="margin-top:10px">타이머 <input type="date" id="timer-day" value="' + (timerDraft.day || kstDay(serverNow())) + '">' +
      '<input type="time" id="timer" value="' + (timerDraft.time || '') + '">' +
      '<button type="button" data-act="timer">설정</button>' +
      '<button type="button" data-act="timer-in" data-min="5">5분 뒤</button><button type="button" data-act="timer-in" data-min="10">10분 뒤</button>' +
      '<button type="button" data-act="timer-off">끄기</button><span class="hint">' + (end ? end + '까지' : '꺼짐') + '</span></div>' +
      fxHtml(live.fx) +
      '<p class="hint">OBS 브라우저 소스(1920×1080): <a href="overlay.html" target="_blank">overlay.html</a>은 여기서 고른 화면을 따릅니다. ' +
      'OBS 장면마다 따로 넣으려면 <code>overlay.html?scene=bracket</code>처럼 고정하세요 (standby·rule·bracket·track·blank).</p></div>';
    return html;
  }

  function bracketHtml(live) {
    var ids = teamIds(), html = '<div class="card"><h2>6강 배치</h2><p class="hint">대진표 맨 아래 칸 왼쪽부터. 1·2번이 1경기, 3·4번이 2경기, 5·6번이 3경기(승자 결승 직행)입니다.</p><div class="r1">';
    live.r1.forEach(function (cur, i) {
      html += '<select data-r1="' + i + '"><option value="">' + (i + 1) + '번 — 비움</option>';
      ids.forEach(function (tid) {
        if (tid !== cur && live.r1.indexOf(tid) >= 0) return;
        html += '<option value="' + tid + '"' + (tid === cur ? ' selected' : '') + '>' + (i + 1) + '번 — ' + esc(teamName(tid)) + '</option>';
      });
      html += '</select>';
    });
    return html + '</div></div>';
  }

  function diffOptions(list, cur, blank) {
    return '<option value="">' + blank + '</option>' + list.map(function (v) { return '<option' + (v === cur ? ' selected' : '') + '>' + v + '</option>'; }).join('');
  }

  function scoreInput(mid, i, uid, nick, locked, g) {
    var k = 's/' + mid + '/' + i + '/' + uid, v = ((state.scores[mid] || {})[i] || {})[uid];
    var shown = k in typing ? typing[k] : (typeof v === 'number' ? fmtScore(v) : '');
    var d = (g.d || {})[uid] || {}, dk = i + '/d/' + uid + '/';
    var lead = Object.keys(state.teams).some(function (t) { return state.teams[t].lead === uid; });
    return '<label><span>' + esc(nick) + (lead ? ' <small>팀장</small>' : '') + '</span>' +
      (g.song ? '<select data-diff="' + dk + 'btn">' + diffOptions(BUTTONS, d.btn, '버튼') + '</select>' +
        '<select data-diff="' + dk + 'pat">' + diffOptions(PATTERNS, d.pat, '패턴') + '</select>' : '') + '<input type="text" inputmode="numeric" data-k="' + k + '" value="' + esc(shown) + '"' + (locked ? ' disabled' : '') + '></label>';
  }

  function gameRow(live, mid, ids, i) {
    var m = live.matches[mid], g = m.games[i] || {}, final = matchInfo(mid).stage === 'f';
    var locked = finalDone(live, mid) && !g.base;
    var html = '<div class="game' + (locked ? ' locked' : '') + '"><div class="slot">' +
      (g.song ? '<img class="jacket" alt="" src="' + jacketUrl(g.song) + '">' : '<div class="jacket"></div>') +
      '<div class="name"><b>' + (i + 1) + '판</b> ' + (g.song ? esc(g.song.n) : '<small>곡 없음</small>') +
      (g.by ? '<small>' + esc(teamName(g.by)) + ' 선곡</small>' : '') + '</div>' +
      '<div><div class="hint">기준 점수</div><div class="base">' + (g.base ? fmtScore(g.base) : '—') + '</div></div>' +
      '<button type="button" data-act="roll" data-i="' + i + '"' + (!g.song || locked ? ' disabled' : '') + '>' + (g.base ? '다시 추첨' : '기준점수 추첨') + '</button>' +
      (g.base ? '<button type="button" data-act="unroll" data-i="' + i + '">초기화</button>' : '') + '</div>';
    var d = ids.map(function (tid) { return gameDiff(live, state.teams, state.scores, mid, i, tid); });
    html += '<div class="sides">';
    ids.forEach(function (tid, k) {
      var members = (state.teams[tid] || {}).members || {}, total = teamTotal(state.teams, state.scores, mid, i, tid);
      var win = d[0] != null && d[1] != null && d[k] < d[1 - k];
      html += '<div class="side"><h3>' + esc(teamName(tid)) + '</h3>';
      Object.keys(members).forEach(function (uid) { html += scoreInput(mid, i, uid, members[uid], locked, g); });
      html += '<div class="hint num">합산 ' + (total == null ? '—' : fmtScore(total)) + ' · 차이 <span class="' + (win ? 'lead' : '') + '">' +
        (d[k] == null ? '—' : fmtScore(d[k])) + '</span>' + (final && win ? ' · <span class="lead">판 승리</span>' : '') + '</div></div>';
    });
    if (final && d[0] != null && d[0] === d[1]) html += '<p class="hint">이 판은 동점입니다.</p>';
    return html + '</div></div>';
  }

  function matchHtml(live) {
    var g = derive(live);
    if (!edit) edit = live.cur || 'm1';
    var html = '<div class="card"><h2>경기</h2><div class="matches">';
    MATCHES.forEach(function (x) {
      var t = g.teams[x.id];
      html += '<button type="button" data-act="edit" data-mid="' + x.id + '"' + (edit === x.id ? ' class="on"' : '') + '>' + x.name +
        (live.cur === x.id ? ' <span class="onair">방송 중</span>' : '') +
        '<small>' + (t[0] || t[1] ? esc(teamName(t[0]) || '?') + ' vs ' + esc(teamName(t[1]) || '?') : '미정') + '</small></button>';
    });
    html += '</div>';

    var info = matchInfo(edit), ids = g.teams[edit], m = live.matches[edit], final = info.stage === 'f';
    if (!ids[0] || !ids[1]) return html + '<p class="hint">' + (edit === 'm4' || edit === 'm5' ? '앞 경기 승자가 정해지면 진행할 수 있습니다.' : '6강 배치에서 두 팀을 정하세요.') + '</p></div>';

    html += '<h2 style="margin-top:16px">' + info.name + ' — ' + esc(teamName(ids[0])) + ' vs ' + esc(teamName(ids[1])) + '</h2><div class="row">' +
      '<button type="button" class="primary" data-act="onair">트랙리스트에 띄우기</button>';
    if (final) html += '<button type="button" data-act="draw">' + (m.pool.length ? '3곡 다시 추첨' : '결승 3곡 추첨') + '</button>';
    else html += '<button type="button" data-act="load">자선곡 다시 불러오기</button><button type="button" data-act="swap">판 순서 바꾸기</button>';
    html += '<button type="button" data-act="reset"' + (m.pool.length || m.games.some(function (x) { return x.song; }) ? '' : ' disabled') + '>곡 초기화</button></div>';
    // 곡을 넣은 뒤 대진이 바뀌면 판에 이전 팀의 곡과 난이도가 남습니다
    if (m.games.some(function (x) { return x.song && x.by && ids.indexOf(x.by) < 0; })) {
      html += '<p class="msg error">곡을 넣은 뒤 대진이 바뀌었습니다. 지금 두 팀의 자선곡과 난이도로 바꾸려면 ' + (final ? '3곡 다시 추첨' : '자선곡 다시 불러오기') + '을 누르세요.</p>';
    }
    if (final) html += '<p class="hint">후보 ' + m.pool.length + '곡: ' + (m.pool.map(function (s) { return esc(s.n); }).join(', ') || '추첨 전') + '</p>';

    for (var i = 0; i < gameCount(edit); i++) html += gameRow(live, edit, ids, i);

    var lead = '';
    if (ids.every(function (t) { return typeof m.sum[t] === 'number'; }) && m.sum[ids[0]] !== m.sum[ids[1]]) {
      lead = ids[(final ? m.sum[ids[0]] > m.sum[ids[1]] : m.sum[ids[0]] < m.sum[ids[1]]) ? 0 : 1];
    }
    html += '<div class="game"><div class="row">';
    ids.forEach(function (tid) {
      var v = m.sum[tid];
      html += '<span class="grow num' + (lead === tid ? ' lead' : '') + '">' + esc(teamName(tid)) + ': ' +
        (typeof v !== 'number' ? '—' : final ? v + '승' : '획득 점수 합 ' + fmtScore(v)) + '</span>';
    });
    html += '</div>' + (ids.every(function (t) { return typeof m.sum[t] === 'number'; }) && !lead ? '<p class="hint">동점입니다. 재경기 방식은 아직 정하지 않았으니 승자를 직접 지정하세요.</p>' : '') +
      '<div class="row" style="margin-top:8px">';
    ids.forEach(function (tid) {
      html += '<button type="button" data-act="win" data-tid="' + tid + '"' + (g.win[edit] === tid ? ' class="on"' : '') + '>' + esc(teamName(tid)) + ' 승자 확정</button>';
    });
    html += (m.win ? '<button type="button" data-act="unwin">승자 해제</button>' : '') + '</div></div>';
    return html + '</div>';
  }

  function gameHtml() {
    var live = normLive(state.live);
    return sceneHtml(live) + bracketHtml(live) + matchHtml(live);
  }

  async function gameAction(act, b) {
    var live = normLive(state.live), u = {}, base = 'live/matches/' + edit + '/';
    if (act === 'scene') return set(roomRef('live/scene'), b.dataset.scene);
    if (act === 'fx-all') {
      // 이 화면의 효과를 모든 화면에 복사합니다 (예전 공용 설정은 지웁니다)
      var src = normLive(state.live).fx[b.dataset.scene], all = {};
      SCENES.forEach(function (s) { all[s.id] = src; });
      return set(roomRef('live/fx'), all);
    }
    if (act === 'timer-off') return remove(roomRef('live/timer'));
    if (act === 'timer-in') return set(roomRef('live/timer'), serverNow() + b.dataset.min * 60000);
    if (act === 'timer') {
      var t = document.getElementById('timer').value;
      if (!t) return say('error', '시각을 입력하세요.');
      // 날짜를 비우면 오늘
      var day = document.getElementById('timer-day').value || kstDay(serverNow());
      timerDraft = {};
      return set(roomRef('live/timer'), Date.parse(day + 'T' + t + ':00+09:00'));
    }
    if (act === 'edit') { edit = b.dataset.mid; notice = ''; return render(); }

    var ids = derive(live).teams[edit], m = live.matches[edit];
    if (act === 'onair') {
      u['live/cur'] = edit;
      u['live/scene'] = 'track';
      // 처음 띄우는 6강·4강 경기는 자선곡을 함께 불러옵니다
      if (matchInfo(edit).stage !== 'f' && !m.games.some(function (x) { return x.song; })) loadPicks(edit, ids, u);
      return update(roomRef(), u);
    }
    if (act === 'load') {
      if (m.games.some(function (x) { return x.base; }) && !confirm('자선곡을 왼쪽 팀부터 다시 불러올까요? 기준점수와 점수는 그대로 둡니다.')) return;
      return update(roomRef(), loadPicks(edit, ids, u));
    }
    if (act === 'swap') {
      u[base + 'games'] = [m.games[1] || null, m.games[0] || null];
      var sc = state.scores[edit] || {};
      u['scores/' + edit] = { 0: sc[1] || null, 1: sc[0] || null };
      return saveMatch(edit, u);
    }
    if (act === 'draw') {
      if (m.pool.length && !confirm('결승 3곡을 다시 추첨할까요? 기준점수와 입력한 점수가 지워집니다.')) return;
      // 두 팀 결승 후보를 모으고 같은 곡은 한 번만 넣습니다
      var pool = [], by = {};
      ids.forEach(function (tid) {
        slots(state.picks[tid], STAGES[2]).forEach(function (c) { if (c && !(c.s in by)) { by[c.s] = { tid: tid, c: c }; pool.push(songOf(c)); } });
      });
      if (pool.length < 3) return say('error', '결승 후보곡이 3곡보다 적습니다 (' + pool.length + '곡). 팀·자선곡 탭에서 확인하세요.');
      var left = pool.slice(), games = [];
      for (var i = 0; i < 3; i++) {
        var c = left.splice(randInt(left.length), 1)[0], pc = by[c.s];
        games.push({ song: c, by: pc.tid, d: presetDiff(pc.c, ids) });
      }
      u[base + 'pool'] = pool;
      u[base + 'games'] = games;
      u[base + 'drawAt'] = serverTimestamp();
      u[base + 'win'] = null;
      u['scores/' + edit] = null;
      u['live/cur'] = edit;
      u['live/scene'] = 'track';
      return saveMatch(edit, u);
    }
    // 곡을 넣기 전 상태로 되돌립니다 (결승은 추첨 전으로)
    if (act === 'reset') {
      if (!confirm(matchInfo(edit).name + ' 곡을 초기화할까요? 판별 곡·기준점수·난이도·입력한 점수와 승자가 지워집니다.')) return;
      u[base + 'games'] = null;
      u[base + 'pool'] = null;
      u[base + 'drawAt'] = null;
      u[base + 'win'] = null;
      u['scores/' + edit] = null;
      return saveMatch(edit, u);
    }
    if (act === 'roll') {
      var i = Number(b.dataset.i);
      if (m.games[i].base && !confirm((i + 1) + '판 기준점수를 다시 추첨할까요?')) return;
      u[base + 'games/' + i + '/base'] = randomBase();
      u[base + 'games/' + i + '/at'] = serverTimestamp();
      return saveMatch(edit, u);
    }
    // 기준점수를 지웁니다. 입력한 선수 점수는 남고, 판 결과는 다시 추첨할 때까지 비워 둡니다
    if (act === 'unroll') {
      var j = Number(b.dataset.i);
      if (!confirm((j + 1) + '판 기준점수를 지울까요? 방송 화면에는 ?로 나옵니다.')) return;
      u[base + 'games/' + j + '/base'] = null;
      u[base + 'games/' + j + '/at'] = null;
      return saveMatch(edit, u);
    }
    if (act === 'win') return set(roomRef(base + 'win'), b.dataset.tid);
    if (act === 'unwin') return remove(roomRef(base + 'win'));
  }

  async function saveScore(k, text) {
    var p = k.split('/'), mid = p[1], digits = text.replace(/[^\d]/g, '');
    var v = digits ? Number(digits) : null;
    if (v != null && v > 9999999) return say('error', '점수가 너무 큽니다.');
    var u = {};
    u['scores/' + mid + '/' + p[2] + '/' + p[3]] = v;
    // 저장하면서 바로 다시 그려지므로 입력 기록을 먼저 지웁니다
    delete typing[k];
    await saveMatch(mid, u);
  }

  app.addEventListener('change', async function (e) {
    try {
      if (e.target.dataset.r1 != null) await set(roomRef('live/r1/' + e.target.dataset.r1), e.target.value || null);
      var f = e.target.dataset.fx;
      if (f) await set(roomRef('live/fx/' + f), /\/ms$/.test(f) ? Number(e.target.value) : e.target.value);
      var df = e.target.dataset.diff;
      if (df) await set(roomRef('live/matches/' + edit + '/games/' + df), e.target.value || null);
      var pd = e.target.dataset.pdiff;
      if (pd) await set(roomRef('picks/' + pd), e.target.value || null);
    } catch (err) {
      say('error', /permission/i.test(err.code + err.message) ? '권한이 없습니다. 다시 로그인하세요.' : err.message);
    }
  });
  // 점수는 칸을 벗어날 때 저장합니다. 다시 그리면 칸이 새로 만들어져 change가 오지 않으므로 입력 기록(typing)으로 판단합니다
  app.addEventListener('focusout', async function (e) {
    var k = e.target.dataset.k;
    if (!k || !(k in typing) || !e.target.isConnected) return;
    try { await saveScore(k, typing[k]); } catch (err) {
      say('error', /permission/i.test(err.code + err.message) ? '권한이 없습니다. 다시 로그인하세요.' : err.message);
    }
  });
  // 점수 칸에서 Enter를 누르면 다음 칸으로
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || !e.target.dataset.k) return;
    var all = Array.from(app.querySelectorAll('input[data-k]:not(:disabled)')), next = all[all.indexOf(e.target) + 1];
    if (next) next.focus(); else e.target.blur();
  });

  // 입력값은 그리기 전에 드래프트로 옮겨 둡니다
  app.addEventListener('input', function (e) {
    if (e.target.dataset.k) { typing[e.target.dataset.k] = e.target.value; return; }
    if (e.target.id === 'timer') { timerDraft.time = e.target.value; return; }
    if (e.target.id === 'timer-day') { timerDraft.day = e.target.value; return; }
    var card = e.target.closest('.team'), f = e.target.dataset.f;
    if (!card || !f) return;
    var d = draftOf(card.dataset.tid);
    if (f === 'name') d.name = e.target.value;
    else d.ids[Number(f.slice(2))] = e.target.value.trim();
  });

  async function fetchNicks(ids) {
    var r = await fetch(AUTH_URL + '/admin/nicks', { method: 'POST', body: new URLSearchParams({ key: key(), ids: ids.join(',') }) });
    if (await keyRejected(r)) throw new Error(key() ? '비밀키가 맞지 않습니다. 다시 로그인하세요.' : '이 탭에 비밀키가 없습니다. 로그아웃 후 다시 로그인하세요.');
    if (!r.ok) throw new Error((r.status === 403 ? '프록시에서 차단됨 ' : '서버 오류 ') + r.status);
    return r.json();
  }

  function newTid() {
    var used = Object.keys(state.teams).concat(Object.keys(drafts)), i = 1;
    while (used.indexOf('t' + i) >= 0) i++;
    return 't' + i;
  }

  app.addEventListener('click', async function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var act = b.dataset.act, card = b.closest('.team'), tid = card && card.dataset.tid;
    try {
      if (act === 'logout') { setKey(''); await signOut(auth); return; }
      if (act === 'tab') { tab = b.dataset.tab; history.replaceState(null, '', tab === 'game' ? '#game' : '#'); notice = ''; return render(); }
      if (tab === 'game') { notice = ''; return await gameAction(act, b); }
      if (act === 'add') { draftOf(newTid()); notice = ''; return render(); }
      if (act === 'deadline') {
        var v = document.getElementById('deadline').value;
        if (!v) return say('error', '마감 시각을 입력하세요.');
        await set(roomRef('config/deadline'), Date.parse(v + ':00+09:00'));
        return say('ok', '마감 시각을 저장했습니다.');
      }
      if (act === 'nicks' || act === 'save') {
        var d = draftOf(tid);
        card.querySelectorAll('input[data-f]').forEach(function (el) {
          if (el.dataset.f === 'name') d.name = el.value; else d.ids[Number(el.dataset.f.slice(2))] = el.value.trim();
        });
        var ids = d.ids.filter(Boolean);
        if (ids.some(function (id) { return !/^\d{5,25}$/.test(id); })) return say('error', '디스코드 ID는 숫자만 입력하세요.');
        if (act === 'save') {
          if (ids.length !== 2) return say('error', '선수 2명의 디스코드 ID를 모두 입력하세요.');
          if (ids[0] === ids[1]) return say('error', '같은 ID를 두 번 넣었습니다.');
          var other = teamIds().filter(function (t) { return t !== tid && ids.some(function (id) { return state.teams[t].members && id in state.teams[t].members; }); })[0];
          if (other) return say('error', '이미 다른 팀(' + (teamIds().indexOf(other) + 1) + '팀)에 등록된 선수가 있습니다.');
        }
        if (ids.length) Object.assign(d.nicks, await fetchNicks(ids));
        if (act === 'nicks') { notice = ''; return render(); }
        if (ids.some(function (id) { return d.nicks[id] === null; })) return say('error', '서버(길드)에 없는 ID가 있습니다. 확인 후 다시 저장하세요.');
        var members = {};
        ids.forEach(function (id) { members[id] = d.nicks[id]; });
        var t = state.teams[tid];
        await set(roomRef('teams/' + tid), {
          name: d.name.trim(),
          n: t ? t.n : teamIds().reduce(function (m, x) { return Math.max(m, state.teams[x].n || 0); }, 0) + 1,
          members: members,
          lead: ids[0]
        });
        delete drafts[tid];
        return say('ok', '팀을 저장했습니다.');
      }
      if (act === 'delete') {
        if (state.teams[tid] && !confirm('이 팀과 팀의 자선곡을 모두 지울까요?')) return;
        var u = {};
        u['teams/' + tid] = null;
        u['picks/' + tid] = null;
        if (state.teams[tid]) await update(roomRef(), u);
        delete drafts[tid];
        return say('ok', '팀을 삭제했습니다.');
      }
      var stage = b.dataset.stage, i = Number(b.dataset.i);
      var info = STAGES.filter(function (s) { return s.key === stage; })[0];
      var path = 'picks/' + tid + '/' + stage + (info.count > 1 ? '/' + i : '');
      if (act === 'clear') { await remove(roomRef(path)); notice = ''; return; }
      if (act === 'pick') {
        var song = await pickSong(info.name + ' 자선곡' + (info.count > 1 ? ' ' + (i + 1) : ''));
        if (!song) return;
        if (slots(state.picks[tid], info).some(function (c, j) { return c && j !== i && c.s === song.s; })) return say('error', '같은 단계에 이미 고른 곡입니다.');
        await set(roomRef(path), song);
        notice = '';
      }
    } catch (err) {
      say('error', /permission/i.test(err.code + err.message) ? '권한이 없습니다. 다시 로그인하세요.' : err.message);
    }
  });

  async function start(user) {
    subs.forEach(function (off) { off(); });
    subs = [];
    if (!user || !key()) return loginScreen();
    var claims = (await user.getIdTokenResult()).claims;
    if (claims.admin !== ROOM) return loginScreen();
    ['config', 'teams', 'picks', 'live', 'scores'].forEach(function (k) {
      subs.push(onValue(roomRef(k), function (s) { state[k] = s.val() || {}; render(); },
        function (err) { say('error', '불러오지 못했습니다: ' + err.message); }));
    });
  }
  onAuthStateChanged(auth, start);
</script>
</body>
</html>
