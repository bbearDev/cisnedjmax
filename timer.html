<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>디맥테마 전쟁 — 준비화면 </title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  /*   backgound IMG  */
  :root { --bg: url('https://raw.githubusercontent.com/bbearDev/cisnedjmax/main/1standby.png'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body::before {
    content: ''; position: fixed; inset: -60px;
    background: var(--bg) center / cover no-repeat;
    filter: blur(30px) brightness(0.85);
  }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: var(--bg) no-repeat 0 0 / 1920px 1080px;
    transform-origin: 0 0;
  }
  .clock {
    position: absolute; left: 453px; top: 802px; width: 995px; height: 231px;
    box-sizing: border-box; padding-left: 150px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Pretendard Variable', Pretendard, 'Noto Sans CJK KR', sans-serif;
    font-size: 150px; font-weight: 900; letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
    color: #5a1a6e;
    text-shadow: 0 4px 0 rgba(255, 255, 255, 0.9);
  }
</style>
</head>
<body>
<div class="stage" id="stage"><div class="clock" id="clock">--:--:--</div></div>
<script>
  var TARGET = '21:00';

  var stage = document.getElementById('stage');
  var clock = document.getElementById('clock');
  function fit() {
    var s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' +
      (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
  }
  function pad(n) { return String(n).padStart(2, '0'); }
  function parseTarget(s) {
    var m = /^(\d{1,2}):(\d{2})(?::(\d{2}))?$/.exec(s);
    if (m) {
      var d = new Date();
      d.setHours(+m[1], +m[2], +(m[3] || 0), 0);
      return d.getTime();
    }
    return new Date(s).getTime();
  }
  var target = parseTarget(new URLSearchParams(location.search).get('to') || TARGET);

  // Sync 위젯 데이터 (https://sync.havana.moe/widget-guide)
  // 디렉터가 타이머를 설정하면 그 값을, 아니면 TARGET 카운트다운을 씁니다.
  var timer = null;
  function onData(d) { timer = d && d.timer; }
  if (window.RT) {
    RT.onData(onData);
  } else {
    addEventListener('message', function (e) {
      var msg = e.data;
      if (e.source !== parent || !msg || msg.source !== 'rhythm-tourney' || msg.type !== 'data') return;
      onData(msg.data);
    });
    if (parent !== window) parent.postMessage({ source: 'rhythm-tourney-widget', type: 'ready' }, '*');
  }

  function remainingMs() {
    var now = Date.now();
    if (timer && timer.present) {
      if (!timer.running) return timer.displayMs;
      return timer.mode === 'down' ? Math.max(0, timer.anchorMs - now) : Math.max(0, now - timer.anchorMs);
    }
    return isNaN(target) ? NaN : Math.max(0, target - now);
  }
  function render() {
    var ms = remainingMs();
    if (isNaN(ms)) { clock.textContent = '--:--'; return; }
    var up = timer && timer.present && timer.mode === 'up';
    var s = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, sec = s % 60;
    clock.textContent = (h > 0 ? h + ':' + pad(m) : pad(m)) + ':' + pad(sec);
  }
  addEventListener('resize', fit);
  fit();
  render();
  setInterval(render, 200);
</script>
</body>
</html>
