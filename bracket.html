<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>디맥테마 전쟁 — 대진표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root { --bg: url('https://raw.githubusercontent.com/bbearDev/cisnedjmax/main/4bracket.png'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: 'Pretendard Variable', Pretendard, 'Noto Sans CJK KR', sans-serif; }
  body.overlay::before {
    content: ''; position: fixed; inset: -60px;
    background: var(--bg) center / cover no-repeat;
    filter: blur(30px) brightness(0.85);
  }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: var(--bg) no-repeat 0 0 / 1920px 1080px;
    transform-origin: 0 0;
  }
  /* 이미지의 흰 칸 위에 정확히 겹치는 이름 칸 */
  .slot {
    position: absolute; box-sizing: border-box; padding: 0 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; color: #4a1458; letter-spacing: -0.01em; line-height: 1.1;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .slot .name { display: block; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; }
  .slot.small { font-size: 30px; }
  .slot.big { font-size: 36px; }
  .slot.has-sum.small { font-size: 26px; }
  .slot.has-sum.big { font-size: 31px; }
  /* 이름 아래 3곡 합산 점수 */
  .slot .sum { font-size: 19px; font-weight: 800; color: #9a5bb5; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .slot.small .sum { font-size: 16px; margin-top: 2px; }
  .slot.win {
    background: linear-gradient(180deg, #fff3b0, #ffd23f);
    box-shadow: 0 0 0 4px #fff, 0 0 26px 8px rgba(255, 200, 40, 0.85);
    font-weight: 900;
  }
  .slot.win .sum { color: #7a3d8f; }

  /* 조작판 (?control) */
  body.control { background: #1e1b24; color: #eee; font-size: 15px; overflow: auto; }
  .panel { padding: 12px; max-width: 900px; margin: 0 auto; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .panel button {
    background: #3b3347; color: #eee; border: 1px solid #6b5a80; border-radius: 6px;
    padding: 8px 12px; font: inherit; cursor: pointer;
  }
  .panel button:disabled { opacity: 0.4; cursor: default; }
  .panel select { background: #2b2733; color: #eee; border: 1px solid #555; border-radius: 6px; padding: 8px; font: inherit; width: 100%; }
  .round { margin-bottom: 18px; }
  .round h3 { margin: 0 0 6px; font-size: 14px; color: #b9a6d0; }
  .hint { font-size: 13px; color: #9a90a8; margin: 4px 0 0; }
  .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
  .match { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .match .label { width: 80px; color: #b9a6d0; font-size: 14px; }
  .match button { flex: 1; min-width: 160px; display: flex; justify-content: space-between; gap: 8px; }
  .match button.win { background: #ffd23f; color: #3a2a00; border-color: #ffd23f; font-weight: 800; }
  .match .sum { font-variant-numeric: tabular-nums; opacity: 0.8; }
  .match .sum.lead { color: #ff9a3c; opacity: 1; font-weight: 800; }
  .match button.win .sum.lead { color: #b04a00; }
  .status { font-size: 13px; color: #aaa; margin-left: auto; }
  .status.ok { color: #7ee08a; }
  .status.err { color: #ff6b6b; }
</style>
</head>
<body>
<script src="tourney.js"></script>

<script>
  var state = normalize(null);

  if (q.has('control')) {
    document.body.className = 'control';
    document.body.innerHTML = '<div class="panel"><div class="bar"><button id="clearWin">승자 전체 해제</button>' +
      '<button id="clearAll">전체 초기화</button><span class="status" id="status">연결 중…</span></div>' +
      '<div id="view"></div></div>';
    var statusEl = document.getElementById('status');
    var view = document.getElementById('view');
    var migrated = false;

    function setStatus(t) { statusEl.textContent = t[0]; statusEl.className = 'status ' + (t[1] || ''); }
    function set(patch) {
      Object.keys(patch).forEach(function (p) { setPath(state, p, patch[p]); });
      draw();
      save(patch).then(function (code) { setStatus(statusText(code)); });
    }
    function esc(t) { var d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

    function draw() {
      var g = derive(state);
      var ids = Object.keys(state.players).sort(function (a, b) { return state.players[a].n - state.players[b].n; });
      var html = '<div class="round"><h3>6강 선수 배치 (맨 아래 칸 왼쪽부터)</h3><div class="cells">';
      state.r1.forEach(function (cur, i) {
        html += '<select data-slot="' + i + '"><option value="">' + (i + 1) + '번 칸 — 비움</option>';
        ids.forEach(function (id) {
          // 다른 칸에 이미 배치된 선수는 고를 수 없습니다
          if (id !== cur && state.r1.indexOf(id) >= 0) return;
          html += '<option value="' + id + '"' + (id === cur ? ' selected' : '') + '>' +
            (i + 1) + '번 칸 — ' + esc(state.players[id].name) + '</option>';
        });
        html += '</select>';
      });
      html += '</div><p class="hint">선수 등록·이름 수정은 트랙리스트 조작판(track.html?control)에서 합니다.' +
        (ids.length ? '' : ' 아직 등록된 선수가 없습니다.') + '</p></div>';

      html += '<div class="round"><h3>경기 결과 — 승자를 누르면 다음 라운드로 진출 (다시 누르면 취소)</h3>';
      MATCHES.forEach(function (m) {
        var lead = leader(state, g, m.id);
        html += '<div class="match"><span class="label">' + m.name + '</span>';
        g[m.id].forEach(function (pid) {
          var t = total(state, g, m.id, pid);
          html += '<button data-match="' + m.id + '" data-pid="' + pid + '"' + (pid ? '' : ' disabled') +
            (pid && g.win[m.id] === pid ? ' class="win"' : '') + '><span>' + (esc(playerName(state, pid)) || '미정') +
            '</span><span class="sum' + (pid && lead === pid ? ' lead' : '') + '">' + fmtScore(t) + '</span></button>';
        });
        html += '</div>';
        if (m.id === 'm4') html += '<p class="hint">부전승 (4강 오른쪽 → 준결승 오른쪽): ' + (esc(playerName(state, g.r2[2])) || '미정') + '</p>';
      });
      html += '<p class="hint">결승 (우승): ' + (esc(playerName(state, g.r4[0])) || '미정') + '</p></div>';
      view.innerHTML = html;

      view.querySelectorAll('select[data-slot]').forEach(function (el) {
        el.onchange = function () { var p = {}; p['r1/' + el.dataset.slot] = el.value; set(p); };
      });
      view.querySelectorAll('button[data-match]').forEach(function (b) {
        b.onclick = function () {
          var m = b.dataset.match, p = {};
          p['matches/' + m + '/win'] = g.win[m] === b.dataset.pid ? null : b.dataset.pid;
          set(p);
        };
      });
    }

    // 이전 방식(칸에 이름 직접 입력)으로 저장된 6강 이름은 선수로 등록해 옮깁니다
    function migrate() {
      if (migrated) return;
      migrated = true;
      if (Object.keys(state.players).length) return;
      var patch = {}, any = false;
      state.r1.forEach(function (name, i) {
        if (!name) return;
        var id = 'p' + Date.now().toString(36) + i;
        patch['players/' + id] = { name: name, n: Date.now() + i };
        patch['r1/' + i] = id;
        any = true;
      });
      if (!any) return;
      ['r2', 'r3', 'r4', 'win'].forEach(function (k) { patch[k] = null; });
      set(patch);
    }

    document.getElementById('clearWin').onclick = function () {
      var p = {};
      MATCHES.forEach(function (m) { p['matches/' + m.id + '/win'] = null; });
      set(p);
    };
    document.getElementById('clearAll').onclick = function () {
      if (!confirm('6강 배치와 승자를 모두 지울까요? (선수 등록·곡·점수는 그대로 남습니다)')) return;
      var p = {};
      for (var i = 0; i < 6; i++) p['r1/' + i] = '';
      MATCHES.forEach(function (m) { p['matches/' + m.id + '/win'] = null; });
      set(p);
    };

    if (!KEY) setStatus(['주소에 &key= 가 없습니다', 'err']);
    else subscribe(function (s) { state = s; draw(); migrate(); },
      function (ok) { setStatus(ok ? ['실시간 연결됨', 'ok'] : ['재연결 중…', 'err']); });
    draw();
  }
</script>

<script>
  // 4bracket.png 흰 칸의 측정 좌표 [left, top, width, height]
  var SLOTS = {
    r1: [[120, 788, 257, 92], [392, 788, 257, 92], [695, 788, 257, 92],
         [973, 788, 257, 92], [1276, 788, 257, 92], [1548, 788, 257, 92]],
    r2: [[290, 690, 204, 74], [857, 698, 204, 74], [1437, 691, 204, 74]],
    r3: [[521, 579, 257, 92], [1123, 579, 257, 92]],
    r4: [[825, 466, 257, 92]]
  };

  if (!q.has('control')) {
    document.body.className = 'overlay';
    var stage = document.createElement('div');
    stage.className = 'stage';
    document.body.appendChild(stage);
    var els = {};

    Object.keys(SLOTS).forEach(function (round) {
      SLOTS[round].forEach(function (r, i) {
        var el = document.createElement('div');
        el.className = 'slot ' + (round === 'r2' ? 'small' : 'big');
        el.style.left = r[0] + 'px'; el.style.top = r[1] + 'px';
        el.style.width = r[2] + 'px'; el.style.height = r[3] + 'px';
        el.innerHTML = '<span class="name"></span><span class="sum"></span>';
        stage.appendChild(el);
        els[round + '-' + i] = el;
      });
    });

    function apply() {
      var g = derive(state);
      Object.keys(els).forEach(function (id) {
        var p = id.split('-'), round = p[0], i = +p[1], el = els[id];
        var pid = g[round][i], mid = SLOT_MATCH[round][i];
        var name = playerName(state, pid);
        var sum = pid && mid ? total(state, g, mid, pid) : null;
        // 승자 강조: 경기 승자, 4강 부전승, 결승(우승) 칸
        var win = !!name && (mid ? g.win[mid] === pid : true);
        var nameEl = el.firstChild, sumEl = el.lastChild;
        var hadSum = el.classList.contains('has-sum');
        el.classList.toggle('has-sum', sum != null);
        el.classList.toggle('win', win);
        sumEl.textContent = fmtScore(sum);
        if (nameEl.textContent !== name || hadSum !== (sum != null)) {
          nameEl.textContent = name; nameEl.style.fontSize = ''; shrinkToFit(nameEl);
        }
      });
    }
    // 긴 이름은 칸을 넘지 않도록 글자 크기를 줄입니다
    function shrinkToFit(el) {
      var size = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > el.clientWidth && size > 14) {
        size -= 1;
        el.style.fontSize = size + 'px';
      }
    }

    subscribe(function (s) { state = s; apply(); });
    // Sync 외부 URL 위젯 규약 (https://sync.havana.moe/widget-guide)
    if (parent !== window) parent.postMessage({ source: 'rhythm-tourney-widget', type: 'ready' }, '*');

    fitStage(stage);
    apply();
    // 웹폰트가 늦게 로드되면 폭이 바뀌므로 한 번 더 맞춥니다
    if (document.fonts) document.fonts.ready.then(function () {
      Object.keys(els).forEach(function (id) { var n = els[id].firstChild; n.style.fontSize = ''; shrinkToFit(n); });
    });
  }
</script>
</body>
</html>
