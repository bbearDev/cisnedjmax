<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>디맥테마 전쟁 — 키워드선택</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
<style>
  :root { --bg: url('https://raw.githubusercontent.com/bbearDev/cisnedjmax/main/6keyword.png'); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: 'Pretendard Variable', Pretendard, 'Noto Sans CJK KR', sans-serif; }
  body.overlay::before {
    content: ''; position: fixed; inset: -60px;
    background: var(--bg) center / cover no-repeat;
    filter: blur(30px) brightness(0.85);
  }
  .stage {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    background: var(--bg) no-repeat 0 0 / 1920px 1080px;
    transform-origin: 0 0;
  }
  .kw {
    position: absolute; white-space: nowrap; user-select: none;
    padding: 6px 22px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.88); border: 3px solid #7b3a96;
    font-weight: 900; color: #4a1458; letter-spacing: -0.01em; line-height: 1.25;
    box-shadow: 0 4px 0 rgba(74, 20, 88, 0.35);
    transition: opacity 0.3s ease 0.35s;
  }
  .kw::after {
    content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 6px; margin-top: -3px;
    background: #d6246e; border-radius: 3px;
    transform: scaleX(0); transform-origin: left center; transition: transform 0.35s ease;
  }
  .kw.off { opacity: var(--off-opacity); }
  .kw.off::after { transform: scaleX(1); }
  .local .kw { cursor: pointer; }

  /* 조작판 (?control) */
  body.control { background: #1e1b24; color: #eee; font-size: 15px; overflow: auto; }
  .panel { padding: 12px; max-width: 900px; margin: 0 auto; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .panel button {
    background: #3b3347; color: #eee; border: 1px solid #6b5a80; border-radius: 6px;
    padding: 8px 12px; font: inherit; cursor: pointer;
  }
  .list { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
  .list button { font-weight: 700; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list button.off { text-decoration: line-through; text-decoration-color: #ff5c93; text-decoration-thickness: 2px; opacity: 0.5; }
  .status { font-size: 13px; color: #aaa; margin-left: auto; }
  .status.ok { color: #7ee08a; }
  .status.err { color: #ff6b6b; }
  details { margin-top: 16px; }
  textarea { width: 100%; height: 220px; box-sizing: border-box; margin: 8px 0; background: #2b2733; color: #eee;
             border: 1px solid #555; border-radius: 6px; padding: 8px; font: inherit; }
</style>
</head>
<body>
<script>
  // Firebase Realtime Database 주소와 방 이름 (sync-remote-guide.md 참고)
  var DB_URL = 'https://cisne-djmax-default-rtdb.asia-southeast1.firebasedatabase.app/';
  var ROOM = 'main';
  // DB에 키워드가 없을 때 쓰는 기본값
  var KEYWORDS = [
    '키워드1', '키워드2', '키워드3', '키워드4', '키워드5',
    '키워드6', '키워드7', '키워드8', '키워드9', '키워드10',
    '키워드11', '키워드12', '키워드13', '키워드14', '키워드15'
  ];
  var OFF_OPACITY = 0.35;
  // 6keyword.png 안쪽 패널에서 '키워드선택' 간판 아래 영역 [left, top, right, bottom]
  var AREA = [1005, 290, 1820, 905];

  var q = new URLSearchParams(location.search);
  DB_URL = (q.get('db') || DB_URL).replace(/\/$/, '');
  ROOM = q.get('room') || ROOM;
  var STATE_URL = DB_URL + '/keyword/' + encodeURIComponent(ROOM);
  var state = { words: KEYWORDS.slice(), seed: 1, off: [] };

  // Firebase는 빈 배열을 지우고 배열을 객체로 돌려줄 수 있어 정리합니다
  function normalize(s) {
    function list(v) { return v ? Object.keys(v).map(function (k) { return v[k]; }) : []; }
    if (!s) return null;
    var words = list(s.words);
    return { words: words.length ? words : KEYWORDS.slice(), seed: s.seed || 1, off: list(s.off) };
  }
  function toggle(word) {
    var at = state.off.indexOf(word);
    if (at >= 0) state.off.splice(at, 1); else state.off.push(word);
  }
  // DB 변경을 실시간으로 받습니다 (Firebase REST 스트리밍)
  function subscribe(onState, onStatus) {
    var es = new EventSource(STATE_URL + '/state.json');
    es.addEventListener('put', function (e) {
      var msg = JSON.parse(e.data);
      if (msg.path === '/') onState(normalize(msg.data));
      else refetch();
    });
    es.addEventListener('patch', refetch);
    es.onopen = function () { onStatus && onStatus(true); };
    es.onerror = function () { onStatus && onStatus(false); };
    function refetch() {
      fetch(STATE_URL + '/state.json').then(function (r) { return r.json(); })
        .then(function (d) { onState(normalize(d)); });
    }
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
</script>

<script>
  if (q.has('control')) {
    document.body.className = 'control';
    document.body.innerHTML =
      '<div class="panel">' +
      '<div class="bar"><button id="shuffle">섞기</button><button id="reset">초기화</button>' +
      '<span class="status" id="status">연결 중…</span></div>' +
      '<div class="list" id="list"></div>' +
      '<details><summary>키워드 편집</summary>' +
      '<textarea id="words" placeholder="한 줄에 하나씩"></textarea>' +
      '<button id="save">키워드 저장</button></details></div>';

    var KEY = q.get('key') || '';
    var list = document.getElementById('list');
    var statusEl = document.getElementById('status');
    var wordsEl = document.getElementById('words');

    function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = 'status ' + (cls || ''); }
    function draw() {
      list.textContent = '';
      state.words.forEach(function (word) {
        var b = document.createElement('button');
        b.textContent = word; b.title = word;
        if (state.off.indexOf(word) >= 0) b.className = 'off';
        b.onclick = function () { toggle(word); send(); };
        list.appendChild(b);
      });
      if (document.activeElement !== wordsEl) wordsEl.value = state.words.join('\n');
    }
    function send() {
      draw();
      fetch(STATE_URL + '.json', { method: 'PUT', body: JSON.stringify({ key: KEY, state: state }) })
        .then(function (r) {
          if (r.status === 401) setStatus('저장 실패: key 확인', 'err');
          else if (!r.ok) setStatus('저장 실패 (' + r.status + ')', 'err');
          else setStatus('실시간 연결됨', 'ok');
        })
        .catch(function () { setStatus('저장 실패: 네트워크', 'err'); });
    }
    document.getElementById('shuffle').onclick = function () { state.seed = Math.floor(Math.random() * 1e9) + 1; send(); };
    document.getElementById('reset').onclick = function () { state.off = []; send(); };
    document.getElementById('save').onclick = function () {
      var words = wordsEl.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
      if (!words.length) return;
      state.off = state.off.filter(function (w) { return words.indexOf(w) >= 0; });
      state.words = words;
      wordsEl.blur();
      send();
    };

    if (!DB_URL) setStatus('DB_URL 미설정', 'err');
    else if (!KEY) setStatus('주소에 &key= 가 없습니다', 'err');
    else subscribe(function (s) {
      if (s) { state = s; draw(); } else send();
    }, function (ok) { setStatus(ok ? '실시간 연결됨' : '재연결 중…', ok ? 'ok' : 'err'); });
    draw();
  }
</script>

<script>
  if (!q.has('control')) {
    document.body.className = 'overlay' + (DB_URL ? '' : ' local');
    document.documentElement.style.setProperty('--off-opacity', OFF_OPACITY);
    var stage = document.createElement('div');
    stage.className = 'stage';
    document.body.appendChild(stage);
    var els = {}, laidOut = null;

    // 겹치지 않게 무작위 배치하고, 자리가 모자라면 전체 크기를 줄여 다시 배치합니다
    function layout() {
      for (var scale = 1; scale > 0.3; scale *= 0.92) {
        if (tryLayout(scale)) break;
      }
      laidOut = state.seed + '|' + state.words.join('|');
    }
    function tryLayout(scale) {
      stage.textContent = '';
      els = {};
      var rand = mulberry32(state.seed);
      var order = state.words.slice();
      for (var i = order.length - 1; i > 0; i--) {
        var j = Math.floor(rand() * (i + 1)), t = order[i]; order[i] = order[j]; order[j] = t;
      }
      var base = 56 * scale, gap = 10, placed = [];
      return order.every(function (word) {
        var el = document.createElement('div');
        el.className = 'kw';
        el.textContent = word;
        if (!DB_URL) el.onclick = function () { toggle(word); apply(); };
        el.style.fontSize = Math.round(base * (0.85 + rand() * 0.3)) + 'px';
        stage.appendChild(el);
        els[word] = el;
        var angle = (rand() - 0.5) * 10;
        var w = el.offsetWidth, h = el.offsetHeight;
        for (var n = 0; n < 300; n++) {
          var x = AREA[0] + rand() * Math.max(0, AREA[2] - AREA[0] - w);
          var y = AREA[1] + rand() * Math.max(0, AREA[3] - AREA[1] - h);
          var box = [x - gap, y - gap, x + w + gap, y + h + gap];
          if (!placed.some(function (b) { return box[0] < b[2] && b[0] < box[2] && box[1] < b[3] && b[1] < box[3]; })) {
            placed.push(box);
            el.style.left = x + 'px'; el.style.top = y + 'px';
            el.style.transform = 'rotate(' + angle.toFixed(1) + 'deg)';
            return true;
          }
        }
        return false;
      });
    }
    function apply() {
      if (laidOut !== state.seed + '|' + state.words.join('|')) layout();
      Object.keys(els).forEach(function (w) { els[w].classList.toggle('off', state.off.indexOf(w) >= 0); });
    }

    if (DB_URL) subscribe(function (s) { if (s) { state = s; apply(); } });
    // Sync 외부 URL 위젯 규약 (https://sync.havana.moe/widget-guide)
    if (parent !== window) parent.postMessage({ source: 'rhythm-tourney-widget', type: 'ready' }, '*');

    function fit() {
      var s = Math.min(innerWidth / 1920, innerHeight / 1080);
      stage.style.transform = 'translate(' + (innerWidth - 1920 * s) / 2 + 'px,' +
        (innerHeight - 1080 * s) / 2 + 'px) scale(' + s + ')';
    }
    addEventListener('resize', fit);
    fit();
    apply();
    if (document.fonts) document.fonts.ready.then(function () { laidOut = null; apply(); });
  }
</script>
</body>
</html>
